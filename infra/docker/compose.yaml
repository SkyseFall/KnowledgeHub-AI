
name: knowledgehub-local

services:
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgehub}

      POSTGRES_APP_USER: ${DB_USERNAME:-knowledgehub_app}
      POSTGRES_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - knowledgehub-postgres-data:/var/lib/postgresql/data
      - ./init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  knowledgehub-postgres-data:
    name: knowledgehub-postgres-data
