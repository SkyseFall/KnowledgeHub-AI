
spring:
  application:
    name: knowledgehub-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledgehub}
    username: ${DB_USERNAME:knowledgehub_app}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: KnowledgeHubHikariPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: knowledgehub
    default-schema: knowledgehub
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: KnowledgeHub AI
    description: AI-powered document intelligence platform
    version: 0.0.1-SNAPSHOT
